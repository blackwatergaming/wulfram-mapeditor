name: Release desktop editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: '0.5.1'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag belongs to main
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to commits in the reviewed main history."
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build self-contained WebView2 app
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          npm run build:desktop -- --version $version
          Get-FileHash "dist/desktop/WulframForge-$version-win-x64-self-contained.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii "dist/desktop/SHA256SUMS.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WulframForge-win-x64
          path: |
            dist/desktop/WulframForge-*-win-x64-self-contained.zip
            dist/desktop/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "dist/desktop/WulframForge-*-win-x64-self-contained.zip", "dist/desktop/SHA256SUMS.txt" | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $files --repo "${{ github.repository }}" --verify-tag --title "Wulfram Forge ${{ github.ref_name }}" --generate-notes
